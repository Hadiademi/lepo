# Supabase local development config.
# See https://supabase.com/docs/guides/local-development/cli/config

project_id = "lepo"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1m"

[auth.sms]
enable_signup = true
enable_confirmations = true

# Slovenian phone numbers only by default; broaden after launch if needed.
[auth.sms.twilio]
enabled = false

[storage]
enabled = true
file_size_limit = "10MiB"
image_transformation = { enabled = true }

[edge_runtime]
enabled = true
inspector_port = 8083

# Local Inbucket for email testing
[inbucket]
enabled = true
port = 54324
